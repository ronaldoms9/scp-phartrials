services:
  web:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-7.4}
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - db_socket:/var/run/mysqld
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.5
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      TZ: America/Sao_Paulo
    command: ["--character-set-server=latin1", "--collation-server=latin1_swedish_ci", "--sql_mode="]
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - db_socket:/var/run/mysqld
      - ./docker/db-init/00-users.sh:/docker-entrypoint-initdb.d/00-users.sh:ro
      # Importado automaticamente só na 1ª inicialização (volume db_data vazio)
      - ./pt_monitoria_2026-11-15.sql.gz:/docker-entrypoint-initdb.d/10-pt_monitoria.sql.gz:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  db_data:
  db_socket:
