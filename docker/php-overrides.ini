; .user.ini não vale para mod_php, então replicamos aqui
short_open_tag = On
; O código usa host "localhost" (socket unix) -> socket compartilhado com o MariaDB
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
date.timezone = America/Sao_Paulo
upload_max_filesize = 64M
post_max_size = 64M
