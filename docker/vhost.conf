<Directory /var/www/html>
    AllowOverride All
    Require all granted
    # O .htaccess usa "AddHandler application/x-httpd-php74" (cPanel); aqui forçamos o handler do mod_php.
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>
ServerName localhost
