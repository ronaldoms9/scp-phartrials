<Directory /var/www/html>
    # Dentro do <Directory> para ter precedência sobre o DirectoryIndex do httpd.conf/php.conf
    # (o repo tem um index.html padrão do CWP que, senão, é servido no lugar do index.php)
    DirectoryIndex index.php index.html
    AllowOverride All
    Require all granted
    # O .htaccess usa "AddHandler application/x-httpd-php74" (cPanel); SetHandler tem precedência e envia ao PHP-FPM.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>
</Directory>
ServerName localhost
